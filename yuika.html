function checkKeyFormat() {

  const key =
    document.getElementById("apiKey").value;

  const warnEl =
    document.getElementById("keyWarning");

  if (key.includes("…") || key.includes("...")) {

    warnEl.textContent =
      "⚠ 省略記号が含まれています。全文を貼り付けてください。";

    warnEl.style.display = "block";

  } else if (key && !key.startsWith("sk-or-v1-")) {

    warnEl.textContent =
      "⚠ OpenRouterのキーは通常 sk-or-v1- から始まります。";

    warnEl.style.display = "block";

  } else {

    warnEl.style.display = "none";

  }
}


/* =========================================================
   APIキー確認
========================================================= */

async function verifyKey() {

  const apiKey =
    document.getElementById("apiKey").value.trim();

  const resultEl =
    document.getElementById("verifyResult");

  if (!apiKey) {

    resultEl.textContent =
      "⚠ キーを入力してください";

    resultEl.style.color = "#c0392b";

    return;
  }

  resultEl.textContent = "確認中...";
  resultEl.style.color = "#999";

  try {

    const res = await fetch(
      "https://openrouter.ai/api/v1/key",
      {
        method: "GET",
        headers: {
          "Authorization": "Bearer " + apiKey
        }
      }
    );

    const data = await res.json();

    if (!res.ok) {

      resultEl.textContent =
        "✗ 無効です: " +
        res.status +
        " — " +
        (data.error?.message || JSON.stringify(data));

      resultEl.style.color = "#c0392b";

      return;
    }

    const usage =
      data.data?.usage ?? "不明";

    const limit =
      data.data?.limit ?? null;

    resultEl.textContent =
      `✓ 有効なキーです（使用額: $${usage} / 上限: ${
        limit === null ? "無制限" : "$" + limit
      }）`;

    resultEl.style.color = "#2e8b57";

  } catch (err) {

    resultEl.textContent =
      "✗ 通信エラー: " + err.message;

    resultEl.style.color = "#c0392b";
  }
}

];

function getUnusedTopic() {

  const used =
    boards.free.usedTopics;

  const remaining =
    TOPICS.filter(topic => !used.has(topic));

  if (remaining.length === 0) {
    used.clear();
  }

  const pool =
    remaining.length > 0
      ? remaining
      : TOPICS;

  const pick =
    pool[Math.floor(Math.random() * pool.length)];

  used.add(pick);

  return pick;
}


/* =========================================================
   ラベル
========================================================= */

const BOARD_LABELS = {
  meeting: "出会い板",
  dating: "恋人板",
  free: "自由板"
};

function canInputOnCurrentBoard() {

  if (currentBoard === "free") {
    return boards.free.unlocked;
  }

  return (
    currentBoard === activeBoard &&
    !boards[currentBoard].completed &&
    !boards[currentBoard].episodeFinished
  );
}

function updateInputLock() {

  const allow =
    canInputOnCurrentBoard();

  inputEl.disabled = !allow;
  sendBtn.disabled = !allow;

  inputEl.placeholder =
    allow
      ? "ゆいかに話しかけてみる..."
      : "次の話へ進んでください";
}


/* =========================================================
   タブ
========================================================= */

function renderBoardTabs() {

  const el =
    document.getElementById("boardTabs");

  el.innerHTML = "";

  ["meeting", "dating", "free"].forEach(key => {

    if (!boards[key].unlocked) return;

    const btn =
      document.createElement("button");

    btn.type = "button";

    btn.className =
      "board-tab" +
      (currentBoard === key ? " active" : "");

    btn.textContent =
      BOARD_LABELS[key];

    btn.onclick =
      () => switchBoard(key);

    el.appendChild(btn);
  });
}


function switchBoard(key) {

  if (!boards[key] || !boards[key].unlocked) {
    return;
  }

  currentBoard = key;

  restoreChatFromBoard();
  updateLabels();
  renderBoardTabs();
  updateInputLock();
}


function updateLabels() {

  document.getElementById("boardLabel").textContent =
    BOARD_LABELS[currentBoard];

  const eventLabel =
    document.getElementById("eventLabel");

  if (currentBoard === "free") {

    eventLabel.textContent =
      `自由会話中（${boards.free.freeTurnCount}/60ターン）`;

  } else if (boards[currentBoard].completed) {

    eventLabel.textContent =
      BOARD_LABELS[currentBoard] +
      "（完了・ログ閲覧）";

  } else {

    const idx =
      boards[currentBoard].episodeIndex;

    const list =
      EPISODES[currentBoard];

    eventLabel.textContent =
      list && list[idx]
        ? list[idx].title
        : "";
  }

  renderBoardTabs();
  updateInputLock();
}


/* =========================================================
   AIに送る履歴
========================================================= */

/*
  重要：
  board.history は「画面に残すログ」。
  episodeHistory は「現在の話のAIに送る会話」。

  これを分離することで、

  出会い1を終了
  ↓
  出会い2へ
  ↓
  画面には出会い1のログが残る
  ↓
  AIには出会い2の会話だけを送る

  という動作になる。
*/

function getEpisodeHistory() {

  return boards[currentBoard].episodeHistory;
}

function pushEpisodeHistory(message) {

  boards[currentBoard].episodeHistory.push(message);
}

function pushDisplayHistory(message) {

  boards[currentBoard].history.push(message);
}

function restoreChatFromBoard() {

  chatEl.innerHTML = "";

  boards[currentBoard].history.forEach(
    message => {

      if (
        message.role === "user" ||
        message.role === "assistant"
      ) {

        addBubble(
          message.role === "user"
            ? "user"
            : "char",
          message.content
        );
      }
    }
  );

  /*
    途中でブラウザを閉じた場合でも、
    「現在の話」が終了済みなら次へボタンを復元する。
  */

  if (
    currentBoard === activeBoard &&
    currentBoard !== "free" &&
    boards[currentBoard].episodeFinished
  ) {

    showNextButton(
      "この話は終了しました。次の話へ進みますか？"
    );
  }
}

function saveState() {

  const saveData = {

    version: 4,

    currentBoard,
    activeBoard,

    boards: {

      meeting: {
        unlocked: boards.meeting.unlocked,
        completed: boards.meeting.completed,
        episodeIndex: boards.meeting.episodeIndex,
        episodeFinished: boards.meeting.episodeFinished,

      },

        episodeFinished: boards.dating.episodeFinished,
        episodeHistory: boards.dating.episodeHistory,
        history: boards.dating.history
      },

      free: {
        unlocked: boards.free.unlocked,
        completed: boards.free.completed,
        freeTurnCount: boards.free.freeTurnCount,

        usedTopics: Array.from(
          boards.free.usedTopics
        ),

    }

    );

  } catch (err) {

    console.error(
      "保存に失敗しました:",
      err
    );
  }
}


/* =========================================================
   読み込み
========================================================= */

function loadState() {

  try {

    const raw =
      localStorage.getItem(SAVE_KEY);

    if (!raw) {
      return false;
    }

    const data =
      JSON.parse(raw);

    if (!data || data.version !== 4) {
      return false;
    }

    currentBoard =
      data.currentBoard || "meeting";

    activeBoard =
      data.activeBoard || "meeting";


    if (data.boards?.meeting) {

      boards.meeting.unlocked =
        !!data.boards.meeting.unlocked;

      boards.meeting.completed =
        !!data.boards.meeting.completed;

      boards.meeting.episodeIndex =
        Number.isInteger(
          data.boards.meeting.episodeIndex
        )
          ? data.boards.meeting.episodeIndex
          : 0;

      boards.meeting.episodeFinished =
        !!data.boards.meeting.episodeFinished;

      boards.meeting.episodeHistory =
        Array.isArray(
          data.boards.meeting.episodeHistory
        )
          ? data.boards.meeting.episodeHistory
          : [];

      boards.meeting.history =
        Array.isArray(
          data.boards.meeting.history
        )
          ? data.boards.meeting.history
          : [];
    }


    if (data.boards?.dating) {

      boards.dating.unlocked =
        !!data.boards.dating.unlocked;

      boards.dating.completed =
        !!data.boards.dating.completed;

      boards.dating.episodeIndex =
        Number.isInteger(
          data.boards.dating.episodeIndex
        )
          ? data.boards.dating.episodeIndex
          : 0;

      boards.dating.episodeFinished =
        !!data.boards.dating.episodeFinished;

      boards.dating.episodeHistory =
        Array.isArray(
          data.boards.dating.episodeHistory
        )
          ? data.boards.dating.episodeHistory
          : [];

      boards.dating.history =
        Array.isArray(
          data.boards.dating.history
        )
          ? data.boards.dating.history
          : [];
    }


    if (data.boards?.free) {

      boards.free.unlocked =
        !!data.boards.free.unlocked;

      boards.free.completed =
        !!data.boards.free.completed;

      boards.free.freeTurnCount =
        Number.isInteger(
          data.boards.free.freeTurnCount
        )
          ? data.boards.free.freeTurnCount
          : 0;

      boards.free.currentTopic =
        data.boards.free.currentTopic || "";

      boards.free.usedTopics =
        new Set(
          data.boards.free.usedTopics || []
        );

      boards.free.episodeHistory =
        Array.isArray(
          data.boards.free.episodeHistory
        )
          ? data.boards.free.episodeHistory
          : [];

      boards.free.history =
        Array.isArray(
          data.boards.free.history
        )
          ? data.boards.free.history
          : [];
    }

    return true;

  } catch (err) {

    console.error(
      "保存データの読み込みに失敗しました:",
      err
    );

    return false;
  }
}

    episodeIndex: 0,
    episodeFinished: false,
    episodeHistory: [],

  };


  boards.free = {
    unlocked: false,
    completed: false,
    freeTurnCount: 0,
    currentTopic: "",

  });


  saveState();

/* =========================================================
   次の話へ
========================================================= */

function goToNextEpisode() {

  const area =
    document.getElementById(
      "nextStepArea"
    );

  if (area) {
    area.remove();
  }


  /* -----------------------------------------
     自由会話
  ----------------------------------------- */

  if (currentBoard === "free") {

    boards.free.freeTurnCount = 0;

    boards.free.currentTopic =
      getUnusedTopic();

    /*
      自由会話も現在の話題ごとにAI履歴を分離。
      画面ログは残す。
    */

    boards.free.episodeHistory = [];

    chatEl.innerHTML = "";

    const message =
      boards.free.currentTopic;


    addBubble(
      "char",
      "「" + message + "」"
    );


    pushEpisodeHistory({
      role: "assistant",
      content: "「" + message + "」"
    });


    pushDisplayHistory({
      role: "assistant",
      content: "「" + message + "」"
    });


    updateLabels();
    saveState();

    return;
  }


  const episodes =
    EPISODES[currentBoard];

  const idx =
    boards[currentBoard].episodeIndex;


  /* -----------------------------------------
     同じ板の次の話
  ----------------------------------------- */

  if (
    idx + 1 <
    episodes.length
  ) {

    boards[currentBoard].episodeIndex++;

    boards[currentBoard].episodeFinished =
      false;

    /*
      ここが重要。
      新しい話になったらAI用会話履歴だけ空にする。
      画面に残すログは消さない。
    */

    boards[currentBoard].episodeHistory = [];


    const next =
      episodes[
        boards[currentBoard].episodeIndex
      ];


    addSystemNote(
      next.title
    );


    addBubble(
      "char",
      next.firstMessage
    );


    pushEpisodeHistory({
      role: "assistant",
      content: next.firstMessage
    });


    pushDisplayHistory({
      role: "assistant",
      content: next.firstMessage
    });


    updateLabels();
    saveState();

    return;
  }


  /* -----------------------------------------
     出会い → 恋人
  ----------------------------------------- */

  if (currentBoard === "meeting") {

    boards.meeting.completed = true;

    boards.meeting.episodeFinished = false;


    boards.dating.unlocked = true;
    boards.dating.completed = false;
    boards.dating.episodeIndex = 0;
    boards.dating.episodeFinished = false;
    boards.dating.episodeHistory = [];
    boards.dating.history = [];


    activeBoard = "dating";
    currentBoard = "dating";


    chatEl.innerHTML = "";


    addSystemNote(
      "恋人板を開始します（出会い板のログはタブから確認できます）"
    );


    const next =
      EPISODES.dating[0];


    addBubble(
      "char",
      next.firstMessage
    );


    pushEpisodeHistory({
      role: "assistant",
      content: next.firstMessage
    });


    pushDisplayHistory({
      role: "assistant",
      content: next.firstMessage
    });


    updateLabels();
    saveState();

    return;
  }


  /* -----------------------------------------
     恋人 → 自由
  ----------------------------------------- */

  if (currentBoard === "dating") {

    boards.dating.completed = true;
    boards.dating.episodeFinished = false;


    boards.free.unlocked = true;
    boards.free.completed = false;
    boards.free.freeTurnCount = 0;
    boards.free.currentTopic =
      getUnusedTopic();

    boards.free.episodeHistory = [];
    boards.free.history = [];


    activeBoard = "free";
    currentBoard = "free";


    chatEl.innerHTML = "";


    addSystemNote(
      "自由板を開始します（出会い板・恋人板のログはタブから確認できます）"
    );


    const message =
      "「" +
      boards.free.currentTopic +
      "」";


    addBubble(
      "char",
      message
    );


    pushEpisodeHistory({
      role: "assistant",
      content: message
    });


    pushDisplayHistory({
      role: "assistant",
      content: message
    });


    updateLabels();
    saveState();

    return;
  }
}


/* =========================================================
   メッセージ送信
========================================================= */

async function sendMessage() {

  if (!canInputOnCurrentBoard()) {

    addSystemNote(
      "この話は終了しています。次の話へ進んでください。"
    );

    return;
  }


  const apiKey =
    document
      .getElementById("apiKey")
      .value
      .trim();


  const model =
    document
      .getElementById("modelId")
      .value
      .trim();


  const text =
    inputEl.value.trim();


  if (!apiKey) {

    addSystemNote(
      "⚠ OpenRouterのAPIキーを入力してください"
    );

    return;
  }


  if (!text) {
    return;
  }


  /* -----------------------------------------
     ユーザー発言
  ----------------------------------------- */

  addBubble(
    "user",
    text
  );


  const userMessage = {
    role: "user",
    content: text
  };


  pushEpisodeHistory(userMessage);
  pushDisplayHistory(userMessage);


  saveState();


  inputEl.value = "";

  sendBtn.disabled = true;

  addLoading();


  /*
    system
    ↓
    現在の話の会話履歴だけ

    過去の話のログは画面には残るが、
    毎回AIに全部送り直さない。
  */

  const messages = [

    {
      role: "system",
      content: getSystemPrompt()
    },

    ...getEpisodeHistory()
  ];


  try {

    const res =
      await fetch(
        "https://openrouter.ai/api/v1/chat/completions",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "Authorization":
              "Bearer " + apiKey,

            "HTTP-Referer":
              "https://claude.ai",

            "X-Title":
              "Yuika Story"
          },

          body: JSON.stringify({

            model:
              model ||
              "~anthropic/claude-sonnet-latest",

            messages,

            temperature: 0.9,

            max_tokens: 400

          })
        }
      );


    removeLoading();


    if (!res.ok) {

      const errText =
        await res.text();


      /*
        APIエラーの場合、
        ユーザー発言は履歴に残っているので、
        再送時にも現在の話の流れを保持できる。
      */

      addSystemNote(
        "⚠ APIエラー: " +
        res.status +
        " — " +
        errText.slice(0, 200)
      );


      updateInputLock();

      return;
    }


    const data =
      await res.json();


    const rawReply =
      data.choices?.[0]?.message?.content?.trim();


    if (!rawReply) {

      addSystemNote(
        "⚠ 返信が取得できませんでした"
      );

      console.log(data);

      updateInputLock();

      return;
    }


    /* -----------------------------------------
       終了タグ判定
    ----------------------------------------- */

    const hasEndTag =
      detectEpisodeEnd(rawReply);


    const displayText =
      stripEventTag(rawReply);


    addBubble(
      "char",
      displayText
    );


    const assistantMessage = {
      role: "assistant",
      content: displayText
    };


    pushEpisodeHistory(
      assistantMessage
    );

    pushDisplayHistory(
      assistantMessage
    );


    /*
      まず履歴を保存。
      その後に終了処理。
    */

    saveState();


    if (currentBoard === "free") {
      boards.free.freeTurnCount++;
    }

    if (hasEndTag) {

      boards[currentBoard].episodeFinished = true;

      saveState();

      if (currentBoard === "free") {

        if (boards.free.freeTurnCount >= 60) {

          showNextButton(
            "自由会話を一区切りにしました。新しい話題を始めますか？"
          );

        }

      } else {

        const episodes =
          EPISODES[currentBoard];

        const idx =
          boards[currentBoard].episodeIndex;


        if (
          idx + 1 < episodes.length
        ) {

          showNextButton(
            "この話は終了しました。次の話へ進みますか？"
          );

        } else if (
          currentBoard === "meeting"
        ) {

          showNextButton(
            "出会い板が終了しました。恋人板へ進みますか？"
          );

        } else if (
          currentBoard === "dating"
        ) {

          showNextButton(
            "恋人板が終了しました。自由板へ進みますか？"
          );
        }
      }
    }

  } catch (err) {

    removeLoading();

    addSystemNote(
      "⚠ 通信エラー: " +
      err.message
    );

  }


  updateInputLock();


  if (canInputOnCurrentBoard()) {
    inputEl.focus();
  }
}


/* =========================================================
   Enter送信
========================================================= */

inputEl.addEventListener(
  "keydown",
  e => {

    if (
      e.key === "Enter" &&
      !e.shiftKey
    ) {

      e.preventDefault();

      sendMessage();
    }

  }
);


/* =========================================================
   起動
========================================================= */

window.addEventListener(
  "load",
  () => {

    prefillFromIndex();

    const restored =
      loadState();


    if (restored) {

      /*
        途中でやめて再度開いた場合、
        episodeIndex と episodeHistory が残っているため、
        「その話の途中」から再開する。
      */

      restoreChatFromBoard();

      updateLabels();

      addSystemNote(
        "前回の会話を再開しました"
      );


    } else {

      startStory(false);

    }

  }
);

</script>
