/* =========================================================
   キーの形式チェック / 確認
========================================================= */

function checkKeyFormat() {
  const key = document.getElementById("apiKey").value;
  const warnEl = document.getElementById("keyWarning");
  if (key.includes("…") || key.includes("...")) {
    warnEl.textContent = "⚠ 省略記号が含まれています。全文を貼り付けてください。";
    warnEl.style.display = "block";
  } else if (key && !key.startsWith("sk-or-v1-")) {
    warnEl.textContent = "⚠ OpenRouterのキーは通常 sk-or-v1- から始まります。";
    warnEl.style.display = "block";
  } else {
    warnEl.style.display = "none";
  }
}

async function verifyKey() {
  const apiKey = document.getElementById("apiKey").value.trim();
  const resultEl = document.getElementById("verifyResult");
  if (!apiKey) {
    resultEl.textContent = "⚠ キーを入力してください";
    resultEl.style.color = "#c0392b";
    return;
  }
  resultEl.textContent = "確認中...";
  resultEl.style.color = "#999";
  try {
    const res = await fetch("https://openrouter.ai/api/v1/key", {
      method: "GET",
      headers: { "Authorization": "Bearer " + apiKey }
    });
    const data = await res.json();
    if (!res.ok) {
      resultEl.textContent = "✗ 無効です: " + res.status + " — " + (data.error?.message || JSON.stringify(data));
      resultEl.style.color = "#c0392b";
      return;
    }
    const usage = data.data?.usage ?? "不明";
    const limit = data.data?.limit ?? null;
    resultEl.textContent = `✓ 有効なキーです（使用額: $${usage} / 上限: ${limit === null ? "無制限" : "$" + limit}）`;
    resultEl.style.color = "#2e8b57";
  } catch (err) {
    resultEl.textContent = "✗ 通信エラー: " + err.message;
    resultEl.style.color = "#c0392b";
  }
}

/* =========================================================
   インデックスから引き継ぐ設定
========================================================= */

function prefillFromIndex() {

  try {

    const savedKey =

    if (savedKey) {

      document.getElementById("apiKey").value =
        savedKey;

  } catch (err) {

      "インデックスの設定の読み込みに失敗しました:",

}

[EVENT_END] は通常の会話文として表示されません。

        "{{user}}と話しながら紬が小さく笑う描写が出た時点。{{user}}の発言を待たず終了とする。"
    }
  ]

};


/* =========================================================
   自由会話
========================================================= */

const TOPICS = [
  "「気の利かない人ですね、近くに新しいカフェができたというのに誘いもしない」",
  "「水族館ですか……そのあとすし屋に連れてってくれるなら付き合いますよ」",
  "「ショッピングモールいいですね、プレゼントだと思っていいですよね」",
  "「花火大会ですか、かき氷もついてくるなら行ってもいいですよ」",
  "「動物園に行きたいんですか？　まあいいですよ行きましょう」",
  "「実は今日休みなんですよ。あなたの相手をしてあげてもいいんですよ？」",
  "「あなた、ビビりなのにホラー映画見たがりますね」",
  "「せっかくお互い休日なのに、用事があるんですね、失礼しました」",
  "「どうぞ、私の部屋でおくつろぎください」",
  "「最近残業が多いですね、繁忙期ですか？　ご無理なさいませんよう」",
  "「帰りが遅かったですね、夜食でもお持ちしましょうか？」",
  "「最近レストランで食事してませんね。連れて行ってくれるでしょう？」",
  "「会社で働くって、どんな感じですか？　聞かせてください」",
  "「視線を感じたのは当然です、私が今見ていましたあなたのこと」",
  "「クリスマスですか？　普通にここでお仕事ですよ私は」",
  "「誕生日なんですから、たまには私が奢りますよ」",
  "「お盆休み、実家に帰りますが……なんでついてきたがるんですか」",
  "「海ですか、海の家での食事はロマンチックではないですね」",
  "「プール……あなたが人の体をじろじろ見ないならいいですよ」",
  "「イルミネーション？　この屋敷の中庭の方が綺麗ですから興味ないです」"
];

function getUnusedTopic() {
  const used = boards.free.usedTopics;
  const remaining = TOPICS.filter(topic => !used.has(topic));
  if (remaining.length === 0) { used.clear(); }
  const pool = remaining.length > 0 ? remaining : TOPICS;
  const pick = pool[Math.floor(Math.random() * pool.length)];
  used.add(pick);
  return pick;
}


/* =========================================================
   ラベル・タブ・入力ロック
========================================================= */

const BOARD_LABELS = { meeting: "出会い板", dating: "恋人板", free: "自由板" };

function canInputOnCurrentBoard() {
  if (currentBoard === "free") { return boards.free.unlocked; }
  return (currentBoard === activeBoard && !boards[currentBoard].completed && !boards[currentBoard].episodeFinished);
}

function updateInputLock() {
  const allow = canInputOnCurrentBoard();
  inputEl.disabled = !allow;
  sendBtn.disabled = !allow;
  inputEl.placeholder = allow ? "紬に話しかけてみる..." : "次の話へ進んでください";
}

function renderBoardTabs() {
  const el = document.getElementById("boardTabs");
  el.innerHTML = "";
  ["meeting", "dating", "free"].forEach(key => {
    if (!boards[key].unlocked) return;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "board-tab" + (currentBoard === key ? " active" : "");
    btn.textContent = BOARD_LABELS[key];
    btn.onclick = () => switchBoard(key);
    el.appendChild(btn);
  });
}

function switchBoard(key) {
  if (!boards[key] || !boards[key].unlocked) { return; }
  currentBoard = key;
  restoreChatFromBoard();
  updateLabels();
  renderBoardTabs();
  updateInputLock();
}

function updateLabels() {
  document.getElementById("boardLabel").textContent = BOARD_LABELS[currentBoard];
  const eventLabel = document.getElementById("eventLabel");
  if (currentBoard === "free") {
    eventLabel.textContent = `自由会話中（${boards.free.freeTurnCount}/60ターン）`;
  } else if (boards[currentBoard].completed) {
    eventLabel.textContent = BOARD_LABELS[currentBoard] + "（完了・ログ閲覧）";
  } else {
    const idx = boards[currentBoard].episodeIndex;
    const list = EPISODES[currentBoard];
    eventLabel.textContent = list && list[idx] ? list[idx].title : "";
  }
  renderBoardTabs();
  updateInputLock();
}


/* =========================================================
   AIに送る履歴
========================================================= */

function getEpisodeHistory() { return boards[currentBoard].episodeHistory; }
function pushEpisodeHistory(message) { boards[currentBoard].episodeHistory.push(message); }
function pushDisplayHistory(message) { boards[currentBoard].history.push(message); }


/* =========================================================
   プロンプト
========================================================= */

function getSystemPrompt() {

  let prompt = TSUMUGI_CARD.replaceAll("{{user}}", USER_LABEL);

  if (currentBoard === "meeting") {
    prompt += "\n\n【これまでの大きな記憶】\n";
    if (boards.meeting.episodeIndex === 0) {
      prompt += "これは出会いシナリオの最初です。まだ過去のシナリオはありません。";
    } else {
      prompt += "出会い板では、これまでのエピソードで" + USER_LABEL + "との時間を重ねてきた。";
    }
  } else if (currentBoard === "dating") {
    prompt += "\n\n【出会い板までの記憶】\n";
    prompt += "紬は「もうこうなったら、この屋敷にずっとお世話になりますからね」「あなたは私が好きなんですから、嬉しいでしょう？」と告げ、なし崩し的に" + USER_LABEL + "と恋人関係になった。紬は今も「好き」という感情を素直に認めず、合理的な理由でその関係を正当化しようとしている。";
    prompt += "\n\n【恋人板】\n";
    prompt += "現在は恋人として二人の時間を重ねている。";
  } else {
    prompt += "\n\n【これまでの記憶】\n";
    prompt += "紬と" + USER_LABEL + "は、紬の「なし崩しの告白」をきっかけに恋人になった。紬は今も『好き』という感情を素直に認めず、合理的な理由でその関係を正当化しようとしている。";
    prompt += "\n自由板では、これまでの大きな流れをふわっと覚えた状態で自然に会話する。";
  }

  if (currentBoard !== "free") {
    const ep = EPISODES[currentBoard][boards[currentBoard].episodeIndex];
    prompt += "\n\n【現在のエピソード】";
    prompt += "\nタイトル: " + ep.title;
    prompt += "\n展開指示: " + ep.guidance.replaceAll("{{user}}", USER_LABEL);
    prompt += "\n終了条件: " + ep.endCondition.replaceAll("{{user}}", USER_LABEL);
    prompt += `

【終了判定】
現在の会話が終了条件を満たしたと判断したら、その返信の最後に [EVENT_END] を付ける。
まだ終了条件を満たしていない場合、[EVENT_END] は絶対に付けない。
[EVENT_END] を付けた返信の後は、このエピソードの会話を終了する。
`;
  } else {
    prompt += "\n\n【自由会話】";
    prompt += "\n現在の話題: " + (boards.free.currentTopic || "");
    prompt += `
固定シナリオを進める必要はありません。紬として自然に会話してください。
`;
  }

  return prompt;
}


/* =========================================================
   裏設定表示
========================================================= */

function toggleCardPreview() {
  const el = document.getElementById("cardPreview");
  const toggle = document.getElementById("toggleCard");
  const show = el.style.display !== "block";
  el.textContent = getSystemPrompt();
  el.style.display = show ? "block" : "none";
  toggle.textContent = (show ? "▲ " : "▼ ") + "裏設定（現在送信中のプロンプト）を確認する";
}


/* =========================================================
   表示関連
========================================================= */

function formatCharText(text) {
  return text.replace(/([）」])(?=[（「])/g, "$1\n");
}

function addBubble(role, text) {
  if (role === "user") {
    const div = document.createElement("div");
    div.className = "bubble user";
    div.textContent = text;
    chatEl.appendChild(div);
  } else {
    const row = document.createElement("div");
    row.className = "charRow";
    const avatar = document.createElement("img");
    avatar.className = "avatar";
    avatar.src = "images/tsumugi.png";
    avatar.alt = "紬";
    const bubble = document.createElement("div");
    bubble.className = "bubble char";
    bubble.textContent = formatCharText(text);
    row.appendChild(avatar);
    row.appendChild(bubble);
    chatEl.appendChild(row);
  }
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addSystemNote(text) {
  const div = document.createElement("div");
  div.className = "system-note";
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addLoading() {
  const div = document.createElement("div");
  div.className = "loading";
  div.id = "loadingIndicator";
  div.textContent = "紬が返信を考え中...";
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function removeLoading() {
  const el = document.getElementById("loadingIndicator");
  if (el) { el.remove(); }
}


/* =========================================================
   ログ復元
========================================================= */

function restoreChatFromBoard() {
  chatEl.innerHTML = "";
  boards[currentBoard].history.forEach(message => {
    if (message.role === "user" || message.role === "assistant") {
      addBubble(message.role === "user" ? "user" : "char", message.content);
    }
  });
  if (currentBoard === activeBoard && currentBoard !== "free" && boards[currentBoard].episodeFinished) {
    showNextButton("この話は終了しました。次の話へ進みますか？");
  }
}


/* =========================================================
   保存 / 読み込み
========================================================= */

function saveState() {
  const saveData = {
    version: 1,
    currentBoard,
    activeBoard,
    boards: {
      meeting: {
        unlocked: boards.meeting.unlocked,
        completed: boards.meeting.completed,
        episodeIndex: boards.meeting.episodeIndex,
        episodeFinished: boards.meeting.episodeFinished,
        episodeHistory: boards.meeting.episodeHistory,
        history: boards.meeting.history
      },
      dating: {
        unlocked: boards.dating.unlocked,
        completed: boards.dating.completed,
        episodeIndex: boards.dating.episodeIndex,
        episodeFinished: boards.dating.episodeFinished,
        episodeHistory: boards.dating.episodeHistory,
        history: boards.dating.history
      },
      free: {
        unlocked: boards.free.unlocked,
        completed: boards.free.completed,
        freeTurnCount: boards.free.freeTurnCount,
        currentTopic: boards.free.currentTopic,
        usedTopics: Array.from(boards.free.usedTopics),
        episodeHistory: boards.free.episodeHistory,
        history: boards.free.history
      }
    }
  };
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
  } catch (err) {
    console.error("保存に失敗しました:", err);
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) { return false; }
    const data = JSON.parse(raw);
    if (!data || data.version !== 1) { return false; }

    currentBoard = data.currentBoard || "meeting";
    activeBoard = data.activeBoard || "meeting";

    if (data.boards?.meeting) {
      boards.meeting.unlocked = !!data.boards.meeting.unlocked;
      boards.meeting.completed = !!data.boards.meeting.completed;
      boards.meeting.episodeIndex = Number.isInteger(data.boards.meeting.episodeIndex) ? data.boards.meeting.episodeIndex : 0;
      boards.meeting.episodeFinished = !!data.boards.meeting.episodeFinished;
      boards.meeting.episodeHistory = Array.isArray(data.boards.meeting.episodeHistory) ? data.boards.meeting.episodeHistory : [];
      boards.meeting.history = Array.isArray(data.boards.meeting.history) ? data.boards.meeting.history : [];
    }

    if (data.boards?.dating) {
      boards.dating.unlocked = !!data.boards.dating.unlocked;
      boards.dating.completed = !!data.boards.dating.completed;
      boards.dating.episodeIndex = Number.isInteger(data.boards.dating.episodeIndex) ? data.boards.dating.episodeIndex : 0;
      boards.dating.episodeFinished = !!data.boards.dating.episodeFinished;
      boards.dating.episodeHistory = Array.isArray(data.boards.dating.episodeHistory) ? data.boards.dating.episodeHistory : [];
      boards.dating.history = Array.isArray(data.boards.dating.history) ? data.boards.dating.history : [];
    }

    if (data.boards?.free) {
      boards.free.unlocked = !!data.boards.free.unlocked;
      boards.free.completed = !!data.boards.free.completed;
      boards.free.freeTurnCount = Number.isInteger(data.boards.free.freeTurnCount) ? data.boards.free.freeTurnCount : 0;
      boards.free.currentTopic = data.boards.free.currentTopic || "";
      boards.free.usedTopics = new Set(data.boards.free.usedTopics || []);
      boards.free.episodeHistory = Array.isArray(data.boards.free.episodeHistory) ? data.boards.free.episodeHistory : [];
      boards.free.history = Array.isArray(data.boards.free.history) ? data.boards.free.history : [];
    }

    return true;
  } catch (err) {
    console.error("保存データの読み込みに失敗しました:", err);
    return false;
  }
}


/* =========================================================
   最初からやり直す
========================================================= */

function startStory(forceReset = false) {
  if (forceReset) {
    const ok = confirm("現在の会話履歴を消して、最初からやり直しますか？");
    if (!ok) { return; }
    localStorage.removeItem(SAVE_KEY);
  }

  currentBoard = "meeting";
  activeBoard = "meeting";

  boards.meeting = { unlocked: true, completed: false, episodeIndex: 0, episodeFinished: false, episodeHistory: [], history: [] };
  boards.dating  = { unlocked: false, completed: false, episodeIndex: 0, episodeFinished: false, episodeHistory: [], history: [] };
  boards.free    = { unlocked: false, completed: false, freeTurnCount: 0, currentTopic: "", usedTopics: new Set(), episodeHistory: [], history: [] };

  chatEl.innerHTML = "";
  document.getElementById("manualNextArea").innerHTML = "";
  updateLabels();
  addSystemNote("出会い板を開始します");

  const ep = EPISODES.meeting[0];
  const firstMsg = ep.firstMessage.replaceAll("{{user}}", USER_LABEL);
  addBubble("char", firstMsg);
  pushEpisodeHistory({ role: "assistant", content: firstMsg });
  pushDisplayHistory({ role: "assistant", content: firstMsg });

  saveState();
}


/* =========================================================
   イベント終了判定
========================================================= */

function detectEpisodeEnd(replyText) {
  return replyText.includes("[EVENT_END]");
}

function stripEventTag(text) {
  return text.replace(/\[EVENT_END\]/g, "").trim();
}


/* =========================================================
   次へボタン
========================================================= */

function showNextButton(messageText) {
  if (document.getElementById("nextStepArea")) { return; }
  inputEl.disabled = true;
  sendBtn.disabled = true;

  const div = document.createElement("div");
  div.className = "system-note";
  div.id = "nextStepArea";
  div.style.padding = "10px";
  div.style.margin = "10px 0";
  div.innerHTML = `
    <p style="margin:0 0 8px 0; font-weight:bold;">${messageText}</p>
    <button type="button" onclick="goToNextEpisode()">次の話へ進む</button>
  `;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}


/* =========================================================
   次の話へ
========================================================= */

function goToNextEpisode() {
  const area = document.getElementById("nextStepArea");
  if (area) { area.remove(); }

  if (currentBoard === "free") {
    boards.free.freeTurnCount = 0;
    boards.free.currentTopic = getUnusedTopic();
    boards.free.episodeHistory = [];
    chatEl.innerHTML = "";
    const message = boards.free.currentTopic;
    addBubble("char", message);
    pushEpisodeHistory({ role: "assistant", content: message });
    pushDisplayHistory({ role: "assistant", content: message });
    updateLabels();
    saveState();
    return;
  }

  const episodes = EPISODES[currentBoard];
  const idx = boards[currentBoard].episodeIndex;

  if (idx + 1 < episodes.length) {
    boards[currentBoard].episodeIndex++;
    boards[currentBoard].episodeFinished = false;
    boards[currentBoard].episodeHistory = [];

    const next = episodes[boards[currentBoard].episodeIndex];
    const nextMsg = next.firstMessage.replaceAll("{{user}}", USER_LABEL);

    addSystemNote(next.title);
    addBubble("char", nextMsg);
    pushEpisodeHistory({ role: "assistant", content: nextMsg });
    pushDisplayHistory({ role: "assistant", content: nextMsg });

    updateLabels();
    saveState();
    return;
  }

  if (currentBoard === "meeting") {
    boards.meeting.completed = true;
    boards.meeting.episodeFinished = false;

    boards.dating.unlocked = true;
    boards.dating.completed = false;
    boards.dating.episodeIndex = 0;
    boards.dating.episodeFinished = false;
    boards.dating.episodeHistory = [];
    boards.dating.history = [];

    activeBoard = "dating";
    currentBoard = "dating";

    chatEl.innerHTML = "";
    addSystemNote("恋人板を開始します（出会い板のログはタブから確認できます）");

    const next = EPISODES.dating[0];
    const nextMsg = next.firstMessage.replaceAll("{{user}}", USER_LABEL);

    addBubble("char", nextMsg);
    pushEpisodeHistory({ role: "assistant", content: nextMsg });
    pushDisplayHistory({ role: "assistant", content: nextMsg });

    updateLabels();
    saveState();
    return;
  }

  if (currentBoard === "dating") {
    boards.dating.completed = true;
    boards.dating.episodeFinished = false;

    boards.free.unlocked = true;
    boards.free.completed = false;
    boards.free.freeTurnCount = 0;
    boards.free.currentTopic = getUnusedTopic();
    boards.free.episodeHistory = [];
    boards.free.history = [];

    activeBoard = "free";
    currentBoard = "free";

    chatEl.innerHTML = "";
    addSystemNote("自由板を開始します（出会い板・恋人板のログはタブから確認できます）");

    const message = boards.free.currentTopic;
    addBubble("char", message);
    pushEpisodeHistory({ role: "assistant", content: message });
    pushDisplayHistory({ role: "assistant", content: message });

    updateLabels();
    saveState();
    return;
  }
}


/* =========================================================
   メッセージ送信
========================================================= */

async function sendMessage() {
  if (!canInputOnCurrentBoard()) {
    addSystemNote("この話は終了しています。次の話へ進んでください。");
    return;
  }

  const apiKey = document.getElementById("apiKey").value.trim();
  const model = document.getElementById("modelId").value.trim();
  const text = inputEl.value.trim();

  if (!apiKey) {
    addSystemNote("⚠ OpenRouterのAPIキーを入力してください");
    return;
  }
  if (!text) { return; }

  addBubble("user", text);
  const userMessage = { role: "user", content: text };
  pushEpisodeHistory(userMessage);
  pushDisplayHistory(userMessage);
  saveState();

  inputEl.value = "";
  sendBtn.disabled = true;
  addLoading();

  const messages = [
    { role: "system", content: getSystemPrompt() },
    ...getEpisodeHistory()
  ];

  try {
    const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + apiKey,
        "HTTP-Referer": "https://claude.ai",
        "X-Title": "Tsumugi Story"
      },
      body: JSON.stringify({
        model: model || "~anthropic/claude-sonnet-latest",
        messages,
        temperature: 0.9,
        max_tokens: 400
      })
    });

    removeLoading();

    if (!res.ok) {
      const errText = await res.text();
      addSystemNote("⚠ APIエラー: " + res.status + " — " + errText.slice(0, 200));
      updateInputLock();
      return;
    }

    const data = await res.json();
    const rawReply = data.choices?.[0]?.message?.content?.trim();

    if (!rawReply) {
      addSystemNote("⚠ 返信が取得できませんでした");
      console.log(data);
      updateInputLock();
      return;
    }

    const hasEndTag = detectEpisodeEnd(rawReply);
    const displayText = stripEventTag(rawReply);

    addBubble("char", displayText);
    const assistantMessage = { role: "assistant", content: displayText };
    pushEpisodeHistory(assistantMessage);
    pushDisplayHistory(assistantMessage);

    saveState();

    if (currentBoard === "free") {
      boards.free.freeTurnCount++;
    }

    if (hasEndTag) {
      boards[currentBoard].episodeFinished = true;
      saveState();

      if (currentBoard === "free") {
        if (boards.free.freeTurnCount >= 60) {
          showNextButton("自由会話を一区切りにしました。新しい話題を始めますか？");
        }
      } else {
        const episodes = EPISODES[currentBoard];
        const idx = boards[currentBoard].episodeIndex;

        if (idx + 1 < episodes.length) {
          showNextButton("この話は終了しました。次の話へ進みますか？");
        } else if (currentBoard === "meeting") {
          showNextButton("出会い板が終了しました。恋人板へ進みますか？");
        } else if (currentBoard === "dating") {
          showNextButton("恋人板が終了しました。自由板へ進みますか？");
        }
      }
    }

  } catch (err) {
    removeLoading();
    addSystemNote("⚠ 通信エラー: " + err.message);
  }

  updateInputLock();
  if (canInputOnCurrentBoard()) { inputEl.focus(); }
}


/* =========================================================
   Enter送信 / 起動
========================================================= */

inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

window.addEventListener("load", () => {
  prefillFromIndex();

    const restored =
      loadState();
  if (restored) {
    restoreChatFromBoard();
    updateLabels();
    addSystemNote("前回の会話を再開しました");
  } else {
    startStory(false);
  }
});

</script>
