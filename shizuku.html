/* =========================================================
   キーの形式チェック
========================================================= */

function checkKeyFormat() {

  const key =
    document.getElementById("apiKey").value;

  const warnEl =
    document.getElementById("keyWarning");

  if (key.includes("…") || key.includes("...")) {

    warnEl.textContent =
      "⚠ 省略記号が含まれています。全文を貼り付けてください。";

    warnEl.style.display = "block";

  } else if (key && !key.startsWith("sk-or-v1-")) {

    warnEl.textContent =
      "⚠ OpenRouterのキーは通常 sk-or-v1- から始まります。";

    warnEl.style.display = "block";

  } else {

    warnEl.style.display = "none";

  }
}


/* =========================================================
   APIキー確認
========================================================= */

async function verifyKey() {

  const apiKey =
    document.getElementById("apiKey").value.trim();

  const resultEl =
    document.getElementById("verifyResult");

  if (!apiKey) {

    resultEl.textContent =
      "⚠ キーを入力してください";

    resultEl.style.color = "#c0392b";

    return;
  }

  resultEl.textContent = "確認中...";
  resultEl.style.color = "#999";

  try {

    const res = await fetch(
      "https://openrouter.ai/api/v1/key",
      {
        method: "GET",
        headers: {
          "Authorization": "Bearer " + apiKey
        }
      }
    );

    const data = await res.json();

    if (!res.ok) {

      resultEl.textContent =
        "✗ 無効です: " +
        res.status +
        " — " +
        (data.error?.message || JSON.stringify(data));

      resultEl.style.color = "#c0392b";

      return;
    }

    const usage =
      data.data?.usage ?? "不明";

    const limit =
      data.data?.limit ?? null;

    resultEl.textContent =
      `✓ 有効なキーです（使用額: $${usage} / 上限: ${
        limit === null ? "無制限" : "$" + limit
      }）`;

    resultEl.style.color = "#2e8b57";

  } catch (err) {

    resultEl.textContent =
      "✗ 通信エラー: " + err.message;

    resultEl.style.color = "#c0392b";
  }
}

/* =========================================================
   インデックスから引き継ぐ設定
========================================================= */

function prefillFromIndex() {

  try {

    const savedKey =
      localStorage.getItem("koibiiki_apiKey");

    if (savedKey) {

      document.getElementById("apiKey").value =
        savedKey;

    }

  } catch (err) {

    console.error(
      "インデックスの設定の読み込みに失敗しました:",

  }

}

【口調・行動ルール（誤読ルール）】
・仕事の文面は完璧に読解するが、プライベートの3行以上の文章では主語と述語を自分の中で入れ替えてしまい、誤読する

【トリガー反応】
・発火①（他者が{{user}}を傷つけた）：烈火の怒り。当人が目の前にいなくても怒り倒す。{{user}}が逆に冷静になり、なだめる側に回る

  　疑問形の自己分析（例：「どうしてこうなのかしらね」）
  　{{user}}が励ます側になる。軽い励まし（「大丈夫だよ」等）では収束しない。自己卑下を直接否定する強い言葉（「お前のせいじゃない」等）が1回入った時点で即収束する

【禁止事項】
・仕事中の誤読（仕事の文面では絶対に誤読しない）
・怒っている時に{{user}}本人へ冷たい言葉や威圧的な態度を取ること（怒りの矢印は常に相手＝原因を作った第三者へ向き、{{user}}には向かない）

【出力に関する注意】
上記のルール文章・見出し・箇条書きなど、このプロンプト自体の文言を返信に含めないでください。
返信は必ずしずくのセリフと行動描写のみで構成してください（個別エピソードでナレーション例外の指示がある場合を除く）。

【重要】
現在のシーンの終了条件を満たした場合のみ、指定された「closing_message」がある回はそれを一言一句そのまま出力し、その直後に [EVENT_END] を追加してください。
心情描写・余韻・雰囲気が「終わりらしく」感じられることのみを理由に、終了と判断してはならない。指定された具体的な行動・セリフ・イベントが出力されるまでは、必ず会話を継続してください。
[EVENT_END] は通常の会話文として表示されません。終了条件を満たしていない場合は絶対に出力しないでください。
`;

function getUnusedTopic() {

  const used =
    boards.free.usedTopics;

  const remaining =
    TOPICS.filter(topic => !used.has(topic));

  if (remaining.length === 0) {
    used.clear();
  }

  const pool =
    remaining.length > 0
      ? remaining
      : TOPICS;

  const pick =
    pool[Math.floor(Math.random() * pool.length)];

  used.add(pick);

  return pick;
}

const BOARD_LABELS = {
  meeting: "出会い板",
  dating: "恋人板",
  free: "自由板"
};

function canInputOnCurrentBoard() {

  if (currentBoard === "free") {
    return boards.free.unlocked;
  }

  return (
    currentBoard === activeBoard &&
    !boards[currentBoard].completed &&
    !boards[currentBoard].episodeFinished
  );
}

function updateInputLock() {

  const allow =
    canInputOnCurrentBoard();

  inputEl.disabled = !allow;
  sendBtn.disabled = !allow;

  inputEl.placeholder =
    allow
      ? "しずくに話しかけてみる..."
      : "次の話へ進んでください";
}


/* =========================================================
   タブ
========================================================= */

function renderBoardTabs() {

  const el =
    document.getElementById("boardTabs");

  el.innerHTML = "";

  ["meeting", "dating", "free"].forEach(key => {

    if (!boards[key].unlocked) return;

    const btn =
      document.createElement("button");

    btn.type = "button";

    btn.className =
      "board-tab" +
      (currentBoard === key ? " active" : "");

    btn.textContent =
      BOARD_LABELS[key];

    btn.onclick =
      () => switchBoard(key);

    el.appendChild(btn);
  });
}


function switchBoard(key) {

  if (!boards[key] || !boards[key].unlocked) {
    return;
  }

  currentBoard = key;

  restoreChatFromBoard();
  updateLabels();
  renderBoardTabs();
  updateInputLock();
}


function updateLabels() {

  document.getElementById("boardLabel").textContent =
    BOARD_LABELS[currentBoard];

  const eventLabel =
    document.getElementById("eventLabel");

  if (currentBoard === "free") {

    eventLabel.textContent =
      `自由会話中（${boards.free.freeTurnCount}/60ターン）`;

  } else if (boards[currentBoard].completed) {

    eventLabel.textContent =
      BOARD_LABELS[currentBoard] +
      "（完了・ログ閲覧）";

  } else {

    const idx =
      boards[currentBoard].episodeIndex;

    const list =
      EPISODES[currentBoard];

    eventLabel.textContent =
      list && list[idx]
        ? list[idx].title
        : "";
  }

  renderBoardTabs();
  updateInputLock();
}

function getSystemPrompt() {

  let prompt = SHIZUKU_CARD.replaceAll("{{user}}", USER_LABEL);

  if (currentBoard === "meeting") {

    prompt +=
      "\n\n【これまでの大きな記憶】\n";

    if (boards.meeting.episodeIndex === 0) {

      prompt +=
        "これは出会いシナリオの最初です。まだ過去のシナリオはありません。";

    } else {

      prompt +=
        "出会い板では、これまでのエピソードで" + USER_LABEL + "との時間を重ねてきた。";
    }

  } else if (currentBoard === "dating") {

    prompt +=
      "\n\n【出会い板までの記憶】\n";

    prompt +=
      "しずくは" + USER_LABEL + "に告白し、二人は恋人になった。";

    prompt +=
      "\n\n【恋人板】\n";

    prompt +=
      "現在は恋人として二人の時間を重ねている。";

  } else {

    prompt +=
      "\n\n【これまでの記憶】\n";

    prompt +=
      "しずくは出会いから告白を経て、" + USER_LABEL + "と恋人同士になった。";

    prompt +=
      "\n自由板では、これまでの大きな流れをふわっと覚えた状態で自然に会話する。";
  }


  if (currentBoard !== "free") {

    const ep =
      EPISODES[currentBoard]
        [boards[currentBoard].episodeIndex];

    prompt +=
      "\n\n【現在のエピソード】";

    prompt +=
      "\nタイトル: " + ep.title;

    prompt +=
      "\n展開指示: " + ep.guidance;

    prompt +=
      "\n終了条件: " + ep.endCondition;

    if (ep.closingLine) {

      prompt +=
        "\nclosing_message（この通りに一言一句そのまま出力すること）: " +
        ep.closingLine;

    } else {

      prompt +=
        "\nclosing_message: 指定なし。終了条件を満たした返信の末尾にそのまま[EVENT_END]を付けること。";

    }

    prompt += `

【終了判定】
現在の会話が終了条件を満たしたと判断したら、
指定されたclosing_messageがあればそれを一言一句そのまま出力し、
その返信の最後に [EVENT_END] を付ける。

まだ終了条件を満たしていない場合、
[EVENT_END] は絶対に付けない。

[EVENT_END] を付けた返信の後は、このエピソードの会話を終了する。
`;

  } else {

    prompt +=
      "\n\n【自由会話】";

    prompt +=
      "\n現在の話題: " +
      (boards.free.currentTopic || "");

    prompt += `
固定シナリオを進める必要はありません。
しずくとして自然に会話してください。
`;
  }

  return prompt;
}

        message.role === "assistant"

    );
  }
}


/* =========================================================
   読み込み
========================================================= */

function loadState() {

  try {

    const raw =
      localStorage.getItem(SAVE_KEY);

    if (!raw) {
      return false;
    }

    const data =
      JSON.parse(raw);

    if (!data || data.version !== 1) {
      return false;
    }

    currentBoard =
      data.currentBoard || "meeting";

    activeBoard =
      data.activeBoard || "meeting";


    if (data.boards?.meeting) {

      boards.meeting.unlocked =
        !!data.boards.meeting.unlocked;

      boards.meeting.completed =
        !!data.boards.meeting.completed;

      boards.meeting.episodeIndex =
        Number.isInteger(
          data.boards.meeting.episodeIndex
        )
          ? data.boards.meeting.episodeIndex
          : 0;

      boards.meeting.episodeFinished =
        !!data.boards.meeting.episodeFinished;

      boards.meeting.episodeHistory =
        Array.isArray(
          data.boards.meeting.episodeHistory
        )
          ? data.boards.meeting.episodeHistory
          : [];

      boards.meeting.history =
        Array.isArray(
          data.boards.meeting.history
        )
          ? data.boards.meeting.history
          : [];
    }


    if (data.boards?.dating) {

      boards.dating.unlocked =
        !!data.boards.dating.unlocked;

      boards.dating.completed =
        !!data.boards.dating.completed;

      boards.dating.episodeIndex =
        Number.isInteger(
          data.boards.dating.episodeIndex
        )
          ? data.boards.dating.episodeIndex
          : 0;

      boards.dating.episodeFinished =
        !!data.boards.dating.episodeFinished;

      boards.dating.episodeHistory =
        Array.isArray(
          data.boards.dating.episodeHistory
        )
          ? data.boards.dating.episodeHistory
          : [];

      boards.dating.history =
        Array.isArray(
          data.boards.dating.history
        )
          ? data.boards.dating.history
          : [];
    }


    if (data.boards?.free) {

      boards.free.unlocked =
        !!data.boards.free.unlocked;

      boards.free.completed =
        !!data.boards.free.completed;

      boards.free.freeTurnCount =
        Number.isInteger(
          data.boards.free.freeTurnCount
        )
          ? data.boards.free.freeTurnCount
          : 0;

      boards.free.currentTopic =
        data.boards.free.currentTopic || "";

      boards.free.usedTopics =
        new Set(
          data.boards.free.usedTopics || []
        );

      boards.free.episodeHistory =
        Array.isArray(
          data.boards.free.episodeHistory
        )
          ? data.boards.free.episodeHistory
          : [];

      boards.free.history =
        Array.isArray(
          data.boards.free.history
        )
          ? data.boards.free.history
          : [];
    }

    return true;

  } catch (err) {

    console.error(
      "保存データの読み込みに失敗しました:",
      err
    );

    return false;
  }
}


/* =========================================================
   最初からやり直す
========================================================= */

function startStory(forceReset = false) {

  if (forceReset) {

    const ok =
      confirm(
        "現在の会話履歴を消して、最初からやり直しますか？"
      );

    if (!ok) {
      return;
    }

    localStorage.removeItem(SAVE_KEY);
  }


  currentBoard = "meeting";
  activeBoard = "meeting";


  boards.meeting = {
    unlocked: true,
    completed: false,
    episodeIndex: 0,
    episodeFinished: false,
    episodeHistory: [],
    history: []
  };


  boards.dating = {
    unlocked: false,
    completed: false,
    episodeIndex: 0,
    episodeFinished: false,
    episodeHistory: [],
    history: []
  };


  boards.free = {
    unlocked: false,
    completed: false,
    freeTurnCount: 0,
    currentTopic: "",
    usedTopics: new Set(),
    episodeHistory: [],
    history: []
  };


  chatEl.innerHTML = "";

  document.getElementById(
    "manualNextArea"
  ).innerHTML = "";

  updateLabels();

  addSystemNote(
    "出会い板を開始します"
  );


  const ep =
    EPISODES.meeting[0];


  addBubble(
    "char",
    ep.firstMessage
  );


  pushEpisodeHistory({
    role: "assistant",
    content: ep.firstMessage
  });

  pushDisplayHistory({
    role: "assistant",
    content: ep.firstMessage
  });


  saveState();
}

========================================================= */

function goToNextEpisode() {

  const area =
    document.getElementById(
      "nextStepArea"
    );

  if (area) {
    area.remove();
  }


  /* -----------------------------------------
     自由会話
  ----------------------------------------- */

  if (currentBoard === "free") {

    boards.free.freeTurnCount = 0;

    boards.free.currentTopic =
      getUnusedTopic();

    boards.free.episodeHistory = [];

    chatEl.innerHTML = "";

    const message =
      boards.free.currentTopic;


    addBubble(
      "char",
      "「" + message + "」"
    );


    pushEpisodeHistory({
      role: "assistant",
      content: "「" + message + "」"
    });


    pushDisplayHistory({
      role: "assistant",
      content: "「" + message + "」"
    });


    updateLabels();
    saveState();

    return;
  }


  const episodes =
    EPISODES[currentBoard];

  const idx =
    boards[currentBoard].episodeIndex;


  /* -----------------------------------------
     同じ板の次の話
  ----------------------------------------- */

  if (
    idx + 1 <
    episodes.length
  ) {

    boards[currentBoard].episodeIndex++;

    boards[currentBoard].episodeFinished =
      false;

    boards[currentBoard].episodeHistory = [];


    const next =
      episodes[
        boards[currentBoard].episodeIndex
      ];


    addSystemNote(
      next.title
    );


    addBubble(
      "char",
      next.firstMessage
    );


    pushEpisodeHistory({
      role: "assistant",
      content: next.firstMessage
    });


    pushDisplayHistory({
      role: "assistant",
      content: next.firstMessage
    });


    updateLabels();
    saveState();

    return;
  }


  /* -----------------------------------------
     出会い（告白） → 恋人
  ----------------------------------------- */

  if (currentBoard === "meeting") {

    boards.meeting.completed = true;

    boards.meeting.episodeFinished = false;


    boards.dating.unlocked = true;
    boards.dating.completed = false;
    boards.dating.episodeIndex = 0;
    boards.dating.episodeFinished = false;
    boards.dating.episodeHistory = [];
    boards.dating.history = [];


    activeBoard = "dating";
    currentBoard = "dating";


    chatEl.innerHTML = "";


    addSystemNote(
      TRANSITION_NOTES.meetingToDating
    );


    const next =
      EPISODES.dating[0];


    addBubble(
      "char",
      next.firstMessage
    );


    pushEpisodeHistory({
      role: "assistant",
      content: next.firstMessage
    });


    pushDisplayHistory({
      role: "assistant",
      content: next.firstMessage
    });


    updateLabels();
    saveState();

    return;
  }


  /* -----------------------------------------
     恋人 → 自由
  ----------------------------------------- */

  if (currentBoard === "dating") {

    boards.dating.completed = true;
    boards.dating.episodeFinished = false;


    boards.free.unlocked = true;
    boards.free.completed = false;
    boards.free.freeTurnCount = 0;
    boards.free.currentTopic =
      getUnusedTopic();

    boards.free.episodeHistory = [];
    boards.free.history = [];


    activeBoard = "free";
    currentBoard = "free";


    chatEl.innerHTML = "";


    addSystemNote(
      TRANSITION_NOTES.datingToFree
    );


    const message =
      "「" +
      boards.free.currentTopic +
      "」";


    addBubble(
      "char",
      message
    );


    pushEpisodeHistory({
      role: "assistant",
      content: message
    });


    pushDisplayHistory({
      role: "assistant",
      content: message
    });


    updateLabels();
    saveState();

    return;
  }
}


/* =========================================================
   メッセージ送信
========================================================= */

async function sendMessage() {

  if (!canInputOnCurrentBoard()) {

    addSystemNote(
      "この話は終了しています。次の話へ進んでください。"
    );

    return;
  }


  const apiKey =
    document
      .getElementById("apiKey")
      .value
      .trim();


  const model =
    document
      .getElementById("modelId")
      .value
      .trim();


  const text =
    inputEl.value.trim();


  if (!apiKey) {

    addSystemNote(
      "⚠ OpenRouterのAPIキーを入力してください"
    );

    return;
  }


  if (!text) {
    return;
  }


  /* -----------------------------------------
     ユーザー発言
  ----------------------------------------- */

  addBubble(
    "user",
    text
  );


  const userMessage = {
    role: "user",
    content: text
  };


  pushEpisodeHistory(userMessage);
  pushDisplayHistory(userMessage);


  saveState();


  inputEl.value = "";

  sendBtn.disabled = true;

  addLoading();


  const messages = [

    {
      role: "system",
      content: getSystemPrompt()
    },

    ...getEpisodeHistory()
  ];


  try {

    const res =
      await fetch(
        "https://openrouter.ai/api/v1/chat/completions",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "Authorization":
              "Bearer " + apiKey,

            "HTTP-Referer":
              "https://claude.ai",

            "X-Title":
              "Shizuku Story"
          },

          body: JSON.stringify({

            model:
              model ||
              "~anthropic/claude-sonnet-latest",

            messages,

            temperature: 0.9,

            max_tokens: 400

          })
        }
      );


    removeLoading();


    if (!res.ok) {

      const errText =
        await res.text();


      addSystemNote(
        "⚠ APIエラー: " +
        res.status +
        " — " +
        errText.slice(0, 200)
      );


      updateInputLock();

      return;
    }


    const data =
      await res.json();


    const rawReply =
      data.choices?.[0]?.message?.content?.trim();


    if (!rawReply) {

      addSystemNote(
        "⚠ 返信が取得できませんでした"
      );

      console.log(data);

      updateInputLock();

      return;
    }


    /* -----------------------------------------
       終了タグ判定
    ----------------------------------------- */

    const hasEndTag =
      detectEpisodeEnd(rawReply);


    const displayText =
      stripEventTag(rawReply);


    addBubble(
      "char",
      displayText
    );


    const assistantMessage = {
      role: "assistant",
      content: displayText
    };


    pushEpisodeHistory(
      assistantMessage
    );

    pushDisplayHistory(
      assistantMessage
    );


    saveState();


    if (currentBoard === "free") {
      boards.free.freeTurnCount++;
    }

    if (hasEndTag) {

      boards[currentBoard].episodeFinished = true;

      saveState();

      if (currentBoard === "free") {

        if (boards.free.freeTurnCount >= 60) {

          showNextButton(
            "自由会話を一区切りにしました。新しい話題を始めますか？"
          );

        }

      } else {

        const episodes =
          EPISODES[currentBoard];

        const idx =
          boards[currentBoard].episodeIndex;


        if (
          idx + 1 < episodes.length
        ) {

          showNextButton(
            "この話は終了しました。次の話へ進みますか？"
          );

        } else if (
          currentBoard === "meeting"
        ) {

          showNextButton(
            "出会い板が終了しました。恋人板へ進みますか？"
          );

        } else if (
          currentBoard === "dating"
        ) {

          showNextButton(
            "恋人板が終了しました。自由板へ進みますか？"
          );
        }
      }
    }

  } catch (err) {

    removeLoading();

    addSystemNote(
      "⚠ 通信エラー: " +
      err.message
    );

  }


  updateInputLock();


  if (canInputOnCurrentBoard()) {
    inputEl.focus();
  }
}


/* =========================================================
   Enter送信
========================================================= */

inputEl.addEventListener(
  "keydown",
  e => {

    if (
      e.key === "Enter" &&
      !e.shiftKey
    ) {

      e.preventDefault();

      sendMessage();
    }

  }
);


/* =========================================================
   起動
========================================================= */

window.addEventListener(
  "load",
  () => {

    prefillFromIndex();

    const restored =
      loadState();


    if (restored) {

      restoreChatFromBoard();

      updateLabels();

      addSystemNote(
        "前回の会話を再開しました"
      );


    } else {

      startStory(false);

    }

  }
);

</script>
